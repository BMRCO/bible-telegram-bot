  <style>
    .pageContent h1 { font-family: ui-serif, Georgia, serif; font-size: 26px; margin: 6px 0 4px; }
    .pageLead { color: var(--muted); font-size: 15px; margin: 0 0 18px; line-height:1.6; }
    .backLink { display:inline-block; font-size: 13px; margin-bottom: 6px; text-decoration:none; }

    .pipRow { display:flex; justify-content:center; gap:8px; margin: 4px 0 6px; }
    .pip { width:16px; height:16px; border-radius:50%; border:1px solid color-mix(in srgb, var(--text) 22%, transparent); }
    .pip.done { border-color: transparent; }
    .pipLabel { text-align:center; font-size:12px; color:var(--muted); margin:0 0 18px; }

    .catGrid { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:560px){ .catGrid { grid-template-columns:1fr 1fr; } }
    .catCard { display:block; width:100%; text-align:left; padding:14px; border-radius:14px;
      border:1px solid color-mix(in srgb, var(--text) 10%, transparent);
      background: color-mix(in srgb, var(--text) 3%, transparent);
      color:var(--text); cursor:pointer; font:inherit; transition:border-color .15s, background .15s; }
    .catCard:hover { border-color: color-mix(in srgb, var(--gold) 40%, transparent); background: color-mix(in srgb, var(--gold) 7%, transparent); }
    .catName { font-family: ui-serif, Georgia, serif; font-size:17px; display:block; }
    .catState { display:block; font-size:12px; color:var(--muted); margin-top:5px; }

    .qCard { margin-top:6px; }
    .qProgress { font-size:12px; color:var(--muted); margin-bottom:12px; }
    .qText { font-family: ui-serif, Georgia, serif; font-style:italic; font-size:18px; line-height:1.6; margin:0 0 6px; }
    .qHint { font-size:12.5px; color:var(--muted); margin:0 0 16px; }
    .optList { display:flex; flex-direction:column; gap:10px; }
    .optBtn { display:block; width:100%; text-align:left; padding:12px 14px; border-radius:14px;
      border:1px solid color-mix(in srgb, var(--text) 10%, transparent);
      background: color-mix(in srgb, var(--text) 3%, transparent);
      color:var(--text); font:inherit; font-family: ui-serif, Georgia, serif; line-height:1.55; cursor:pointer; }
    .optBtn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--gold) 40%, transparent); background: color-mix(in srgb, var(--gold) 7%, transparent); }
    .optBtn:disabled { cursor:default; }
    .optBtn.good { border-color:#3d9c63; border-width:2px; background: color-mix(in srgb, #3d9c63 20%, transparent); }
    .optBtn.bad  { border-color:#b04a4a; border-width:2px; background: color-mix(in srgb, #b04a4a 18%, transparent); }
    .optBtn.dim  { opacity:.5; }
    .optMark { float:right; margin-left:10px; font-family: system-ui, sans-serif; font-size:15px; font-weight:800; }
    .optBtn.good .optMark { color:#3d9c63; }
    .optBtn.bad  .optMark { color:#b04a4a; }
    .verdict { font-family: system-ui, sans-serif; font-size:15px; font-weight:800; margin:0 0 8px; }
    .verdict.good { color:#3d9c63; }
    .verdict.bad  { color:#b04a4a; }
    .verdictSub { font-size:13px; color:var(--muted); margin:0 0 10px; line-height:1.55; }
    .optKey { color:var(--gold); font-weight:800; margin-right:10px; font-family: system-ui, sans-serif; font-size:13px; }

    .afterBox { margin-top:16px; padding-top:14px; border-top:1px solid color-mix(in srgb, var(--text) 10%, transparent); }
    .afterRef { color:var(--gold); font-weight:800; font-size:13px; text-decoration:none; }
    .btnRow { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .ctaRead { display:inline-block; padding:11px 16px; border-radius:12px; cursor:pointer; font:inherit; font-weight:700;
      border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);
      background: color-mix(in srgb, var(--gold) 12%, transparent); color:var(--text); text-decoration:none; }
    .ctaRead:hover { background: color-mix(in srgb, var(--gold) 18%, transparent); text-decoration:none; }
    .ctaGhost { display:inline-block; padding:11px 16px; border-radius:12px; cursor:pointer; font:inherit;
      border:1px solid color-mix(in srgb, var(--text) 14%, transparent); background:transparent; color:var(--muted); text-decoration:none; }

    .scoreBig { font-family: ui-serif, Georgia, serif; font-size:34px; margin:8px 0 2px; }
    .hidden { display:none; }
  </style>
  <script>
    (function(){ try { var t = localStorage.getItem('labible:theme') === 'light' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
  </script>
  <script src="/footer.js" defer></script>
  <script src="/header.js" defer></script>
</head>
<body>
  <div id="lb-topbar"></div>
  <main class="container">
    <article class="card pageContent">

      <section id="homeView">
        <a class="backLink muted" href="/">← Accueil</a>
        <h1>Testez votre connaissance biblique</h1>
        <p class="pageLead">Six thèmes, un verset à compléter à chaque question. Saurez-vous les reconnaître ? Votre progression reste sur votre appareil. <strong>Bible Louis Segond 1910.</strong></p>
        <div class="pipRow" id="pipRow"></div>
        <p class="pipLabel" id="pipLabel"></p>
        <div class="catGrid" id="catGrid"></div>
      </section>

      <section id="quizView" class="hidden">
        <a class="backLink muted" href="#" id="backToHome">← Tous les thèmes</a>
        <h1 id="quizTitle"></h1>
        <p class="qProgress" id="qProgress"></p>
        <div class="qCard">
          <p class="qText" id="qText"></p>
          <p class="qHint" id="qHint"></p>
          <div class="optList" id="optList"></div>
          <div class="afterBox hidden" id="afterBox">
            <p class="verdict" id="verdict"></p>
            <p class="verdictSub" id="verdictSub"></p>
            <a class="afterRef" id="afterRef" href="#"></a>
            <div class="btnRow">
              <button class="ctaRead" id="nextBtn">Question suivante</button>
            </div>
          </div>
        </div>
      </section>

      <section id="endView" class="hidden">
        <h1 id="endTitle"></h1>
        <p class="scoreBig" id="endScore"></p>
        <p class="pageLead" id="endMsg"></p>
        <div class="btnRow">
          <button class="ctaRead" id="againBtn">Rejouer ce thème</button>
          <button class="ctaGhost" id="homeBtn">Tous les thèmes</button>
        </div>
      </section>

    </article>
  </main>
  <div id="lb-footer"></div>

<script>
(function(){
  var ROUND = 5;
  var STORE = 'labible:quiz';
  var COLORS = {
    psaumes:'#2f4a6b', promesses:'#2b5c3f', jesus:'#1f2f52',
    proverbes:'#8a6d1f', propheties:'#5b3a6b', protection:'#6b2f2f'
  };
  var ORDER = ['psaumes','promesses','jesus','proverbes','propheties','protection'];

  var bank = null, cat = null, queue = [], idx = 0, score = 0, answered = false;

  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; } }
  function save(s){ try { localStorage.setItem(STORE, JSON.stringify(s)); } catch(e){} }

  function el(id){ return document.getElementById(id); }
  function show(v){
    ['homeView','quizView','endView'].forEach(function(n){
      el(n).classList.toggle('hidden', n !== v);
    });
    window.scrollTo(0,0);
  }

  function renderHome(){
    var st = load(), done = 0;
    var pips = '', grid = '';
    ORDER.forEach(function(k){
      if(!bank[k]) return;
      var s = st[k];
      var isDone = s && s.best !== undefined;
      if(isDone) done++;
      pips += '<span class="pip'+(isDone?' done':'')+'"'+(isDone?' style="background:'+COLORS[k]+'"':'')+'></span>';
      var state = isDone ? ('Terminé · '+s.best+'/'+ROUND) : 'À découvrir';
      grid += '<button class="catCard" data-cat="'+k+'"'+(isDone?' style="border-color:'+COLORS[k]+'"':'')+'>'+
              '<span class="catName">'+bank[k].label+'</span>'+
              '<span class="catState">'+state+'</span></button>';
    });
    el('pipRow').innerHTML = pips;
    el('pipLabel').textContent = done + ' thème' + (done>1?'s':'') + ' sur ' + ORDER.filter(function(k){return bank[k];}).length;
    el('catGrid').innerHTML = grid;
    Array.prototype.forEach.call(document.querySelectorAll('.catCard'), function(b){
      b.addEventListener('click', function(){ start(b.getAttribute('data-cat')); });
    });
    show('homeView');
  }

  function start(k){
    cat = k;
    var all = bank[k].questions.slice();
    for(var i=all.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=all[i]; all[i]=all[j]; all[j]=t; }
    queue = all.slice(0, ROUND);
    idx = 0; score = 0;
    el('quizTitle').textContent = bank[k].label;
    show('quizView');
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    var q = queue[idx];
    el('qProgress').textContent = 'Question ' + (idx+1) + ' sur ' + queue.length;
    el('qText').textContent = q.q;
    el('qHint').textContent = q.p || 'Choisissez la suite du verset.';
    el('afterBox').classList.add('hidden');
    var html = '';
    q.o.forEach(function(o,i){
      html += '<button class="optBtn" data-i="'+i+'"><span class="optKey">'+String.fromCharCode(65+i)+'</span>'+o+'</button>';
    });
    el('optList').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.optBtn'), function(b){
      b.addEventListener('click', function(){ answer(parseInt(b.getAttribute('data-i'),10)); });
    });
  }

  function refToHash(ref){
    var m = ref.match(/^(.+)\s(\d+):(\d+)/);
    return m ? ('/#' + m[1] + '-' + m[2] + ':' + m[3]) : '/';
  }

  function answer(i){
    if(answered) return;
    answered = true;
    var q = queue[idx];
    if(i === q.a) score++;
    var correct = (i === q.a);
    Array.prototype.forEach.call(document.querySelectorAll('.optBtn'), function(b){
      var bi = parseInt(b.getAttribute('data-i'),10);
      b.disabled = true;
      if(bi === q.a){
        b.classList.add('good');
        b.insertAdjacentHTML('afterbegin', '<span class="optMark">\u2713</span>');
      } else if(bi === i){
        b.classList.add('bad');
        b.insertAdjacentHTML('afterbegin', '<span class="optMark">\u2717</span>');
      } else {
        b.classList.add('dim');
      }
    });
    var vd = el('verdict'), vs = el('verdictSub');
    vd.className = 'verdict ' + (correct ? 'good' : 'bad');
    vd.textContent = correct ? '\u2713 Bonne réponse' : '\u2717 Réponse incorrecte';
    vs.textContent = correct
      ? 'Le verset est bien celui-ci.'
      : 'La bonne réponse est signalée ci-dessus.';
    var a = el('afterRef');
    a.textContent = q.r + ' — lire le chapitre';
    a.href = refToHash(q.r);
    el('nextBtn').textContent = (idx+1 >= queue.length) ? 'Voir le résultat' : 'Question suivante';
    el('afterBox').classList.remove('hidden');
  }

  el('nextBtn').addEventListener('click', function(){
    idx++;
    if(idx >= queue.length) finish();
    else renderQuestion();
  });

  function finish(){
    var st = load();
    var prev = st[cat] && st[cat].best !== undefined ? st[cat].best : -1;
    st[cat] = { best: Math.max(prev, score) };
    save(st);
    el('endTitle').textContent = bank[cat].label;
    el('endScore').textContent = score + ' / ' + queue.length;
    el('endMsg').textContent = score === queue.length
      ? 'Thème complété. La Parole demeure.'
      : 'Chaque lecture affermit. Reprenez quand vous le souhaitez.';
    show('endView');
  }

  el('againBtn').addEventListener('click', function(){ start(cat); });
  el('homeBtn').addEventListener('click', function(){ renderHome(); });
  el('backToHome').addEventListener('click', function(e){ e.preventDefault(); renderHome(); });

  fetch('/data/quiz.json?v=1')
    .then(function(r){ return r.json(); })
    .then(function(j){ bank = j; renderHome(); })
    .catch(function(){
      el('catGrid').innerHTML = '<p class="pageLead">Le quiz est momentanément indisponible. <a href="/">Lire la Bible</a></p>';
    });
})();
</script>
</body>
</html>
