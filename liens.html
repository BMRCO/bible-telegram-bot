:root{
  --bg:#0b0b0b; --gold:#e2c57a; --gold-deep:#c9a640; --cream:#f0ead8;
  --line:rgba(226,197,122,.22); --muted:rgba(240,234,216,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--cream);
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:48px 20px 40px;
  background-image:radial-gradient(120% 55% at 50% -8%, rgba(226,197,122,.10), transparent 60%);
}
.wrap{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center}
.logoWrap{width:92px;height:92px;border-radius:50%;overflow:hidden;
  border:2px solid var(--gold); box-shadow:0 0 0 4px rgba(226,197,122,.08);
  display:flex;align-items:center;justify-content:center;background:#10131c;margin-bottom:18px}
.logoImg{width:100%;height:100%;object-fit:cover;display:block}
.logoFallback{display:none;font-size:42px;line-height:1}
.brand{font-family:'EB Garamond',serif;font-size:30px;font-weight:600;letter-spacing:.3px;text-align:center;line-height:1.2}
.brand .dot{color:var(--gold)}
.tag{font-size:13px;color:var(--muted);margin-top:7px;text-align:center;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:380px){.brand{font-size:26px}.btn{padding:14px 16px;font-size:15px}}
.badge{margin-top:14px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold-deep);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.links{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;width:100%;
  padding:15px 18px;border-radius:14px;text-decoration:none;
  font-size:15.5px;font-weight:500;
  transition:transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease}
.btn svg{width:21px;height:21px;flex:0 0 21px}
.btn .lbl{flex:1}
.btn .arr{opacity:.5;font-size:13px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1505;font-weight:600;
  box-shadow:0 6px 20px rgba(226,197,122,.18)}
.btn.primary:hover{box-shadow:0 9px 26px rgba(226,197,122,.28)}
.btn.social{background:rgba(255,255,255,.02);border:1px solid var(--line);color:var(--cream)}
.btn.social svg{color:var(--gold)}
.btn.social:hover{border-color:var(--gold);background:rgba(226,197,122,.06)}
.foot{margin-top:34px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
.foot .sep{color:var(--gold-deep)}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}

/* Rodapé partagé (footer.js) — regles reprises de styles.css, adaptees aux variables de cette page */
.footer{margin-top:30px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 6px;text-align:center;width:100%}
.footer a{color:var(--muted);text-decoration:none}
.footer a:hover{text-decoration:underline}
.footerLinks{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px 10px}
.socialIcons{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;margin:4px 0}
.socialIcons a{display:flex;align-items:center;justify-content:center;opacity:.65;transition:opacity .2s,transform .2s;text-decoration:none;border-bottom:none}
.socialIcons a:hover{opacity:1;transform:translateY(-2px);text-decoration:none}
.socialIcons svg{width:22px;height:22px;display:block}
