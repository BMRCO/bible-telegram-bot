name: Test de voix Google Chirp 3 HD (audio)

# Echantillon d'un Psaume avec les voix Google Chirp 3 HD.
# Ne publie RIEN sur les reseaux : les MP3 vont sur la branche echantillons-voix.
# Demande le secret GOOGLE_TTS_KEY (cle API Google Cloud, Text-to-Speech active).
on:
  workflow_dispatch:
    inputs:
      psaume:
        description: 'Numero du Psaume'
        required: false
        type: string
        default: '23'
      voix:
        description: 'Voix (nom court), separees par des espaces ; debit optionnel : Charon@0.9'
        required: false
        type: string
        default: 'Charon Algenib Iapetus Schedar Orus Enceladus'

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bible/lsg1910.json
            scripts/test_voix_google.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests and ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate samples
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PSAUME: ${{ inputs.psaume }}
          VOIX: ${{ inputs.voix }}
        run: python scripts/test_voix_google.py "$PSAUME" echantillons $VOIX

      - name: Publish samples on the echantillons-voix branch
        run: |
          mkdir -p /tmp/ech && cp echantillons/*.mp3 /tmp/ech/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan echantillons-voix
          git rm -rq --cached --sparse . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ech/*.mp3 .
          git add --sparse *.mp3
          git commit -q -m "Echantillons de voix Google Chirp 3 HD"
          git push -f origin echantillons-voix
