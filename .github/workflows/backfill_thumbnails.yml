name: Vignettes retroactives (videos deja publiees)

# Applique une vignette aux videos deja en ligne. A lancer a la main, autant
# de fois que necessaire : la progression est conservee dans
# backfill_progress.json et chaque passage reprend ou le precedent s'est
# arrete.
#
# Quota YouTube : 50 unites par vignette, 10 000 par jour — environ
# 190 videos quotidiennes au maximum. Au-dela, relancer le lendemain.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Videos a traiter'
        required: true
        type: choice
        default: 'long'
        options:
          - long     # meditations et paraboles : la vignette est utilisee partout
          - short    # Shorts : utile surtout dans les resultats Google
          - all
      limit:
        description: 'Nombre maximum de videos pour ce passage'
        required: false
        type: string
        default: '190'
      dry_run:
        description: 'Simulation (aucune vignette envoyee)'
        required: true
        type: choice
        default: 'true'
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: backfill-thumbnails
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install pillow requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Poser les vignettes
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MODE:    ${{ inputs.mode }}
          LIMIT:   ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--mode $MODE --limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/backfill_thumbnails.py $ARGS

      - name: Enregistrer la progression
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add backfill_progress.json
          git diff --staged --quiet || git commit -m "Backfill vignettes [skip ci]"
          git push || true
