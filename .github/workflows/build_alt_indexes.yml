name: Build promises + jesus indexes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Epingle le 9 octobre 2026. ubuntu-latest passe a Ubuntu 26 entre le
    # 19 octobre et le 19 novembre 2026, progressivement : la bascule peut
    # arriver SANS AUCUN COMMIT et casser ffmpeg, Pillow ou les polices.
    # Ne pas remettre ubuntu-latest sans avoir teste l'image 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build alt indexes
        run: python build_alt_indexes.py

      - name: Commit indexes
        run: |
          git config user.name "bible-telegram-bot"
          git config user.email "bible-telegram-bot@users.noreply.github.com"
          git add promises_index.json jesus_index.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Update promises/jesus indexes"
          for i in 1 2 3; do
            if git push; then
              echo "Index enregistres."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "::error::Index NON enregistres apres 3 tentatives."
          exit 1
