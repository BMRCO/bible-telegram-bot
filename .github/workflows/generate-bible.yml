name: Gerar dados da Biblia LSG1910

on:
  workflow_dispatch:

# Le workflow ecrit dans le depot.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar requests
        run: pip install requests

      - name: Correr script
        run: python generate_bible_data.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bible/
          git diff --cached --quiet || git commit -m "chore: dados LSG1910 regenerados"
          git push
