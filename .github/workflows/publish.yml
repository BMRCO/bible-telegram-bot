name: Publication automatique

on:
  schedule:
    - cron: '7 3 * * *'     # 03h07 UTC - Protection (reel)
    - cron: '9 5 * * *'     # 05h09 UTC - Promesses
    - cron: '7 8 * * *'     # 08h07 UTC - Proverbes
    - cron: '45 11 * * *'   # 11h45 UTC - Jesus
    - cron: '41 15 * * *'   # 15h41 UTC - Propheties
    - cron: '8 17 * * *'    # 17h08 UTC - Psaumes (reel)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de publication'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - image
          - reel
          - parabole
      category:
        description: 'Categorie (laisser vide pour rotation auto)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - promise
          - jesus
          - psaume
          - proverbe
          - prophetie
          - protection
      platform:
        description: 'Plataforma (all = todas)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - telegram
          - facebook
          - instagram
          - youtube
          - pinterest
          - threads

permissions:
  contents: write

# Un groupe DISTINCT par horaire : les runs ne s'annulent plus entre elles.
# (Avec un seul groupe partage, une run du matin retardee etait annulee par la suivante.)
concurrency:
  group: verses-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Un job sans limite occupe un emplacement de concurrence jusqu'a la
    # coupure implicite (6 h). Les deux workflows de meditation fixent 60 ;
    # la publication est plus courte, 30 suffit largement (reel + uploads).
    timeout-minutes: 30
    steps:
      - name: Current UTC time (debug atraso real)
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine publication mode and category
        id: schedule
        env:
          # Passer par l'environnement plutot que d'interpoler dans le script :
          # evite toute injection de commande via une valeur d'entree.
          SCHEDULE:     ${{ github.event.schedule }}
          MANUAL_MODE:  ${{ inputs.mode }}
          INPUT_CAT:    ${{ inputs.category }}
        run: |
          CAT="$INPUT_CAT"

          # Categoria a partir do cron AGENDADO (fiavel apesar do atraso do GitHub:
          # usa o horario agendado, nao a hora de execucao).
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              "7 3 * * *")   CAT="protection" ;;
              "9 5 * * *")   CAT="promise" ;;
              "7 8 * * *")   CAT="proverbe" ;;
              "45 11 * * *") CAT="jesus" ;;
              "41 15 * * *") CAT="prophetie" ;;
              "8 17 * * *")  CAT="psaume" ;;
            esac
          fi

          # Calendrier hybride : toujours 4 reels / 2 images par jour.
          # Fixes en reel : protection (matin), psaume (soir).
          # Alternance jour pair/impair sur les 4 autres.
          DAY=$(date +%j)
          IS_EVEN=$((10#$DAY % 2))   # 0 = jour pair, 1 = jour impair

          if [ -n "$MANUAL_MODE" ] && [ "$MANUAL_MODE" != "auto" ]; then
            MODE="$MANUAL_MODE"
          else
            case "$CAT" in
              protection|psaume) MODE="reel" ;;
              promise|jesus)
                if [ $IS_EVEN -eq 0 ]; then MODE="reel"; else MODE="image"; fi ;;
              proverbe|prophetie)
                if [ $IS_EVEN -eq 0 ]; then MODE="image"; else MODE="reel"; fi ;;
              *) MODE="image" ;;
            esac
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "category=$CAT" >> $GITHUB_OUTPUT

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          BOT_CATEGORY: ${{ steps.schedule.outputs.category }}
          ONLY_PLATFORM: ${{ inputs.platform }}
          PUB_MODE: ${{ steps.schedule.outputs.mode }}
        run: |
          MODE="$PUB_MODE"
          if [ "$MODE" = "reel" ]; then
            python bot.py reel
          elif [ "$MODE" = "parabole" ]; then
            python bot.py parabole
          else
            python bot.py
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push || true