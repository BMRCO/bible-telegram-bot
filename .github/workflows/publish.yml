name: Publication automatique

on:
  # Plus de « schedule » GitHub depuis le 9 novembre 2026 : il arrivait 4 a 8 h
  # en retard. Le Worker Cloudflare labible-horloge (horloge/worker.js) lance
  # ce workflow a l'heure exacte par workflow_dispatch. Horaires : voir PLAN.
  # 8 novembre 2026 (decision de BC) : 5 publications par jour EN TOUT, quiz,
  # Psaume narre et meditation thematique compris. Ici : 2 versets, matin et
  # soir (creneau=matin|soir), categories en rotation sur 3 jours :
  #   jour A : Protection (matin) + Jesus (soir)
  #   jour B : Proverbes (matin)  + Psaumes (soir)
  #   jour C : Promesses (matin)  + Propheties (soir)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de publication'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - image
          - reel
          - parabole
      category:
        description: 'Categorie (laisser vide pour rotation auto)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - promise
          - jesus
          - psaume
          - proverbe
          - prophetie
          - protection
      creneau:
        description: 'Creneau du jour (lance par le Worker labible-horloge) : matin ou soir'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - matin
          - soir
      platform:
        description: 'Plataforma (all = todas)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - telegram
          - facebook
          - instagram
          - youtube
          - pinterest
          - threads

permissions:
  contents: write

# Un groupe DISTINCT par horaire : les runs ne s'annulent plus entre elles.
# (Avec un seul groupe partage, une run du matin retardee etait annulee par la suivante.)
concurrency:
  group: verses-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule'
    # Epingle le 9 octobre 2026. ubuntu-latest passe a Ubuntu 26 entre le
    # 19 octobre et le 19 novembre 2026, progressivement : la bascule peut
    # arriver SANS AUCUN COMMIT et casser ffmpeg, Pillow ou les polices.
    # Ne pas remettre ubuntu-latest sans avoir teste l'image 26.
    runs-on: ubuntu-24.04
    # Un job sans limite occupe un emplacement de concurrence jusqu'a la
    # coupure implicite (6 h). Les deux workflows de meditation fixent 60 ;
    # la publication est plus courte, 30 suffit largement (reel + uploads).
    timeout-minutes: 30
    steps:
      - name: Current UTC time (debug atraso real)
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        # 11 novembre 2026 : apt-get est reste bloque 1 h 19 (miroirs Ubuntu muets) et
        # le job a ete tue sans rien publier. apt-get est donc borne (un essai), et
        # s'il echoue on prend le ffmpeg statique du paquet PyPI imageio-ffmpeg
        # (libx264 + aac, tout ce que les scripts utilisent ; pas de ffprobe, inutilise).
        timeout-minutes: 12
        run: |
          APT="sudo timeout 150 apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1"
          if command -v ffmpeg >/dev/null || { $APT update -qq && $APT install -y -qq ffmpeg; }; then
            ffmpeg -version | head -1; exit 0
          fi
          echo "::warning::apt-get indisponible : ffmpeg statique (imageio-ffmpeg) utilise a la place"
          python3 -m pip install -q imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Determine publication mode and category
        id: schedule
        env:
          # Passer par l'environnement plutot que d'interpoler dans le script :
          # evite toute injection de commande via une valeur d'entree.
          SCHEDULE:     ${{ github.event.schedule }}
          MANUAL_MODE:  ${{ inputs.mode }}
          INPUT_CAT:    ${{ inputs.category }}
          CRENEAU:      ${{ inputs.creneau }}
        run: |
          CAT="$INPUT_CAT"

          # Categoria a partir do cron AGENDADO (fiavel apesar do atraso do GitHub:
          # usa o horario agendado, nao a hora de execucao).
          # Rotation sur 3 jours, calculee sur la date UTC (meme jour = meme
          # categorie, meme si GitHub retarde le run).
          JOUR=$(( $(date -u +%s) / 86400 % 3 ))
          # Depuis le 9 novembre 2026, le Worker Cloudflare labible-horloge
          # lance ce workflow a l'heure exacte avec creneau=matin|soir
          # (le planificateur GitHub arrivait 4 a 8 h en retard).
          case "$CRENEAU" in
            matin) SCHEDULE="37 3 * * *" ;;
            soir)  SCHEDULE="34 17 * * *" ;;
          esac
          if [ -n "$SCHEDULE" ] && [ -z "$CAT" ]; then
            case "$SCHEDULE:$JOUR" in
              "37 3 * * *:0")  CAT="protection" ;;
              "37 3 * * *:1")  CAT="proverbe" ;;
              "37 3 * * *:2")  CAT="promise" ;;
              "34 17 * * *:0") CAT="jesus" ;;
              "34 17 * * *:1") CAT="psaume" ;;
              "34 17 * * *:2") CAT="prophetie" ;;
            esac
          fi

          # Calendrier fixe depuis le 5 novembre 2026 : 3 reels et 2 images,
          # en alternance dans la journee (reel, image, reel, image, reel).
          if [ -n "$MANUAL_MODE" ] && [ "$MANUAL_MODE" != "auto" ]; then
            MODE="$MANUAL_MODE"
          else
            case "$CAT" in
              protection|jesus|psaume|promise) MODE="reel" ;;
              proverbe|prophetie)              MODE="image" ;;
              *)                               MODE="image" ;;
            esac
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "category=$CAT" >> $GITHUB_OUTPUT

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_CATEGORY: ${{ steps.schedule.outputs.category }}
          ONLY_PLATFORM: ${{ inputs.platform }}
          PUB_MODE: ${{ steps.schedule.outputs.mode }}
        run: |
          MODE="$PUB_MODE"
          if [ "$MODE" = "reel" ]; then
            python bot.py reel
          elif [ "$MODE" = "parabole" ]; then
            python bot.py parabole
          else
            python bot.py
          fi

      - name: Commit progress
        # Ajoute le 10 octobre 2026. SANS CE `if:`, GitHub saute ce pas des
        # que le pas precedent echoue. Depuis que finaliser() sort en code 1
        # sur une panne partielle, la progression n'etait plus commitee et le
        # contenu ressortait le lendemain sur les plateformes qui l'avaient
        # deja recu. Republier est pire que rater. !cancelled() = on commite
        # en succes ET en echec, mais pas si le job a ete tue (timeout) :
        # dans ce cas on ne sait pas ou le script s'est arrete.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --staged --quiet; then
            echo "Aucun changement de progression."
            exit 0
          fi
          git commit -m "Update progress [skip ci]"
          # Un commit peut arriver pendant l'execution du workflow : sans rebase
          # prealable le push est rejete (« fetch first »). On reessaie 3 fois.
          for i in 1 2 3; do
            if git push; then
              echo "Progression enregistree."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          # Echec silencieux interdit : la progression perdue republierait le
          # meme contenu demain. On sort en erreur -> e-mail GitHub Actions.
          echo "::error::Progression NON enregistree apres 3 tentatives."
          exit 1
