name: Publication automatique

on:
  # 🚫 CRON DESATIVADO PARA PENTECÔTE (24 mai 2026)
  # Para reativar amanhã, descomenta as linhas cron: abaixo
  #
  # schedule:
  #   - cron: '3 5 * * *'
  #   - cron: '12 7 * * *'
  #   - cron: '0 10 * * *'
  #   - cron: '45 13 * * *'
  #   - cron: '41 17 * * *'
  #   - cron: '8 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de publication'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - image
          - reel
          - parabole
      category:
        description: 'Catégorie (laisser vide pour rotation auto)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - promise
          - jesus
          - psaume
          - proverbe
          - prophetie
          - protection

permissions:
  contents: write

concurrency:
  group: verses-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine publication mode and category
        id: schedule
        run: |
          MANUAL_MODE="${{ inputs.mode }}"
          MANUAL_CAT="${{ inputs.category }}"
          if [ "$MANUAL_MODE" = "auto" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "07" ] || [ "$HOUR" = "13" ] || [ "$HOUR" = "19" ]; then
              echo "mode=reel" >> $GITHUB_OUTPUT
            else
              echo "mode=image" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=$MANUAL_MODE" >> $GITHUB_OUTPUT
          fi
          echo "category=$MANUAL_CAT" >> $GITHUB_OUTPUT

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          BOT_CATEGORY: ${{ steps.schedule.outputs.category }}
        run: |
          MODE="${{ steps.schedule.outputs.mode }}"
          if [ "$MODE" = "reel" ]; then
            python bot.py reel
          elif [ "$MODE" = "parabole" ]; then
            python bot.py parabole
          else
            python bot.py
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push || true