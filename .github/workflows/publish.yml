name: Post daily verse
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (image, reel ou parabole)'
        required: false
        default: 'image'
  schedule:
    - cron: "0 3 * * *"   # 03h UTC → 05h France (image    — Psaume du Matin)
    - cron: "0 4 * * *"   # 04h UTC → 06h France (reel     — Promesses de Dieu)
    - cron: "0 8 * * *"   # 08h UTC → 10h France (parabole — Parabole de Jésus)
    - cron: "0 9 * * *"   # 09h UTC → 11h France (image    — Sagesse Biblique)
    - cron: "0 11 * * *"  # 11h UTC → 13h France (reel     — Paroles de Jésus)
    - cron: "0 15 * * *"  # 15h UTC → 17h France (image    — Prophéties Bibliques)
    - cron: "0 17 * * *"  # 17h UTC → 19h France (reel     — Psaume du Soir)
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "mode=parabole" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ] || [ "${{ github.event.schedule }}" = "0 11 * * *" ] || [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "mode=reel" >> $GITHUB_OUTPUT
          else
            echo "mode=image" >> $GITHUB_OUTPUT
          fi
      - name: Determine category
        id: category
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "cat=psaume" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "cat=promise" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "cat=proverbe" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            echo "cat=jesus" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "cat=prophetie" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "cat=psaume" >> $GITHUB_OUTPUT
          else
            echo "cat=" >> $GITHUB_OUTPUT
          fi
      - name: Post verse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BOT_CATEGORY: ${{ steps.category.outputs.cat }}
        run: python bot.py ${{ steps.mode.outputs.mode }}
      - name: Commit updates
        run: |
          git config user.name "bible-telegram-bot"
          git config user.email "bible-telegram-bot@users.noreply.github.com"
          git add progress.json promesses_curated.json jesus_curated.json psaumes_curated.json proverbes_curated.json propheties_curated.json paraboles_curated.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update progress"
          git pull --rebase=false -s ours origin main || true
          git push origin HEAD:main || true
