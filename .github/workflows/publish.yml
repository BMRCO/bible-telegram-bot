name: Publication automatique

on:
  schedule:
    # Cada categoria alterna image/reel conforme dia par/ímpar do ano
    # 🛡️ 5h UTC → 7h FR  | Protection (image par / reel ímpar)
    # 🌿 7h UTC → 9h FR  | Promesse (reel par / image ímpar)
    # 💡 11h UTC → 13h FR | Sagesse (image par / reel ímpar)
    # ✝️ 13h UTC → 15h FR | Jésus (reel par / image ímpar)
    # 📯 17h UTC → 19h FR | Prophétie (image par / reel ímpar)
    # 🎵 19h UTC → 21h FR | Psaume du Soir (reel par / image ímpar)
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de publication'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - image
          - reel
          - parabole
      category:
        description: 'Catégorie (laisser vide pour rotation auto)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - promise
          - jesus
          - psaume
          - proverbe
          - prophetie
          - protection

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine publication mode and category
        id: schedule
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_MODE="${{ inputs.mode }}"
          MANUAL_CAT="${{ inputs.category }}"
          DAY=$(date +%j)
          IS_EVEN=$((DAY % 2))

          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              "0 5 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=image" >> $GITHUB_OUTPUT
                else
                  echo "mode=reel" >> $GITHUB_OUTPUT
                fi
                echo "category=protection" >> $GITHUB_OUTPUT
                ;;
              "0 7 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=reel" >> $GITHUB_OUTPUT
                else
                  echo "mode=image" >> $GITHUB_OUTPUT
                fi
                echo "category=promise" >> $GITHUB_OUTPUT
                ;;
              "0 11 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=image" >> $GITHUB_OUTPUT
                else
                  echo "mode=reel" >> $GITHUB_OUTPUT
                fi
                echo "category=proverbe" >> $GITHUB_OUTPUT
                ;;
              "0 13 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=reel" >> $GITHUB_OUTPUT
                else
                  echo "mode=image" >> $GITHUB_OUTPUT
                fi
                echo "category=jesus" >> $GITHUB_OUTPUT
                ;;
              "0 17 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=image" >> $GITHUB_OUTPUT
                else
                  echo "mode=reel" >> $GITHUB_OUTPUT
                fi
                echo "category=prophetie" >> $GITHUB_OUTPUT
                ;;
              "0 19 * * *")
                if [ $IS_EVEN -eq 0 ]; then
                  echo "mode=reel" >> $GITHUB_OUTPUT
                else
                  echo "mode=image" >> $GITHUB_OUTPUT
                fi
                echo "category=psaume" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "mode=image" >> $GITHUB_OUTPUT
                echo "category=" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            if [ "$MANUAL_MODE" = "auto" ]; then
              HOUR=$(date -u +%H)
              if [ "$HOUR" = "07" ] || [ "$HOUR" = "13" ] || [ "$HOUR" = "19" ]; then
                echo "mode=reel" >> $GITHUB_OUTPUT
              else
                echo "mode=image" >> $GITHUB_OUTPUT
              fi
            else
              echo "mode=$MANUAL_MODE" >> $GITHUB_OUTPUT
            fi
            echo "category=$MANUAL_CAT" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          BOT_CATEGORY: ${{ steps.schedule.outputs.category }}
        run: |
          MODE="${{ steps.schedule.outputs.mode }}"
          if [ "$MODE" = "reel" ]; then
            python bot.py reel
          elif [ "$MODE" = "parabole" ]; then
            python bot.py parabole
          else
            python bot.py
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push || true