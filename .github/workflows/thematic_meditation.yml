name: Meditation thematique
on:
  schedule:
    # 16h13 UTC  18h13 FR (verao). Com o atraso do GitHub Actions deve cair a noite.
    # AJUSTA este horario depois de veres a que horas cai na realidade.
    - cron: '27 16 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme: protection, paix, peur, esperance, confiance, amour, pardon, guerison, deuil, solitude, priere, gratitude, force, combat, promesses, famille, sagesse, jesus, psaumes, propheties. Vide = rotation auto.'
        required: false
        type: string
        default: ''
permissions:
  contents: write
# Grupo proprio e unico por run - nunca cancela nem e cancelado por outra run.
concurrency:
  group: thematic-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false
jobs:
  thematic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Current UTC time
        run: date -u
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run thematic meditation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Par l'environnement : une entree libre ne doit jamais etre interpolee dans un script.
          IN_THEME: ${{ inputs.theme }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          THEME="${IN_THEME}"
          if [ -n "$THEME" ]; then
            python thematic_meditation.py "$THEME"
          else
            python thematic_meditation.py
          fi
      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_thematic.json
          if git diff --staged --quiet; then
            echo "Aucun changement de progression."
            exit 0
          fi
          git commit -m "Update thematic progress [skip ci]"
          # Un commit peut arriver pendant l'execution du workflow : sans rebase
          # prealable le push est rejete (« fetch first »). On reessaie 3 fois.
          for i in 1 2 3; do
            if git push; then
              echo "Progression enregistree."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          # Echec silencieux interdit : sans progression enregistree, le meme
          # theme serait republie. Sortie en erreur -> e-mail GitHub Actions.
          echo "::error::Progression NON enregistree apres 3 tentatives."
          exit 1