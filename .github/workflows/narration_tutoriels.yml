name: Narration des tutoriels (Henri)

# Echantillon d'un Psaume avec les voix neuronales de Microsoft (edge-tts).
# Ne publie RIEN sur les reseaux : les MP3 vont sur la branche echantillons-voix.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Episodes, separes par des espaces (ex: 1 ou 2 3 4)'
        required: true
        type: string
        default: '1'
      debit:
        description: 'Debit du Henri (ex: -16%)'
        required: false
        type: string
        default: '-16%'
      voix:
        description: 'Vide = Henri ; nom Google Chirp 3 HD (ex: Algieba) ; ou piper:fr/fr_FR/tom/medium/fr_FR-tom-medium'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tutoriels/narration.json
            scripts/narration_tutoriels.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts==7.3.1 requests

      - name: Piper voice
        if: ${{ startsWith(inputs.voix, 'piper:') }}
        env:
          VOIX: ${{ inputs.voix }}
        run: |
          pip install piper-tts==1.8.0
          chemin="${VOIX#piper:}"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${chemin}"
          nom="$(basename "$chemin")"
          curl -fsSL -o "${nom}.onnx" "${base}.onnx"
          curl -fsSL -o "${nom}.onnx.json" "${base}.onnx.json"
          echo "PIPER_MODELE=$PWD/${nom}.onnx" >> "$GITHUB_ENV"

      - name: Generate samples
        env:
          EPS: ${{ inputs.episodes }}
          VOIX_TUTO: ${{ inputs.voix }}
          DEBIT_TUTO: ${{ inputs.debit }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python scripts/narration_tutoriels.py $EPS echantillons

      - name: Publish samples on the echantillons-voix branch
        run: |
          mkdir -p /tmp/ech && cp echantillons/ep* /tmp/ech/ && ls /tmp/ech | grep -q .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan echantillons-voix
          git rm -rq --cached --sparse . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ech/* .
          git add --sparse ep*
          git commit -q -m "Narration des tutoriels"
          git push -f origin echantillons-voix
