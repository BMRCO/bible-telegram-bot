name: Générer pages SEO par chapitre

# Génère labible.app/lsg/{livre}/{chapitre} pour les 1 189 chapitres de la
# Bible (66 livres), à partir de data/lsg1910.json. Met aussi à jour
# sitemap.xml (ajoute les nouvelles URLs, garde celles déjà présentes).
#
# Déclenchement manuel : Actions → Générer pages SEO par chapitre → Run workflow.
# À relancer si le texte de la Bible ou le modèle de page change.

on:
  workflow_dispatch:

# Le workflow ecrit dans le depot.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr script
        run: python generate_chapter_pages.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lsg/ sitemap.xml
          git diff --cached --quiet || git commit -m "chore: pages SEO par chapitre generees (1189 pages)"
          git push
