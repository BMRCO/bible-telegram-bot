name: Threads — renouvellement du jeton

# Le jeton longue duree Threads vit 60 jours et n'est PLUS rafraichissable
# une fois expire (il faudrait alors refaire le parcours OAuth a la main).
# Renouvellement hebdomadaire : large marge en cas d'echec ponctuel.

on:
  schedule:
    - cron: '37 4 * * 2'   # mardi, 04h37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Epingle le 9 octobre 2026. ubuntu-latest passe a Ubuntu 26 entre le
    # 19 octobre et le 19 novembre 2026, progressivement : la bascule peut
    # arriver SANS AUCUN COMMIT et casser ffmpeg, Pillow ou les polices.
    # Ne pas remettre ubuntu-latest sans avoir teste l'image 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests pynacl

      - name: Renouveler le jeton
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT_SECRETS:       ${{ secrets.GH_PAT_SECRETS }}
          REPO:                 ${{ github.repository }}
        run: python scripts/threads_refresh.py
