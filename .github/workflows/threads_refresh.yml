name: Threads — renouvellement du jeton

# Le jeton longue duree Threads vit 60 jours et n'est PLUS rafraichissable
# une fois expire (il faudrait alors refaire le parcours OAuth a la main).
# Renouvellement hebdomadaire : large marge en cas d'echec ponctuel.

on:
  schedule:
    - cron: '37 4 * * 2'   # mardi, 04h37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests pynacl

      - name: Renouveler le jeton
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT_SECRETS:       ${{ secrets.GH_PAT_SECRETS }}
          REPO:                 ${{ github.repository }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/threads_refresh.py
