name: Verifier l'horloge (publications du jour)

# Depuis le 9 novembre 2026, les publications sont lancees par le Worker
# Cloudflare labible-horloge (horloge/worker.js). Si le Worker tombe ou si son
# jeton GitHub expire, AUCUN run n'est cree, donc aucun e-mail d'echec de GitHub.
# Ce workflow est le filet : il compte les lancements des dernieres 24 h et
# passe au ROUGE s'il en manque (=> e-mail de GitHub Actions, comme d'habitude).
# Il reste sur le planificateur de GitHub expres : chemin independant du Worker.
# Son retard eventuel (quelques heures) ne gene pas une alerte.
on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compter les lancements des dernieres 24 h
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          DEPUIS=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Lancements depuis $DEPUIS (UTC)"
          MANQUE=0
          # workflow:nombre attendu par jour (voir PLAN dans horloge/worker.js)
          for ATTENDU in publish.yml:2 meditation.yml:1 quiz_du_jour.yml:1 thematic_meditation.yml:1 bible_audio.yml:5 derniers_temps.yml:1; do
            W=${ATTENDU%%:*}; N=${ATTENDU##*:}
            VU=$(gh api "repos/$DEPOT/actions/workflows/$W/runs?event=workflow_dispatch&created=>=$DEPUIS&per_page=50" --jq '.total_count')
            if [ "$VU" -lt "$N" ]; then
              echo "::error::$W : $VU lancement(s) en 24 h, $N attendu(s). Verifier le Worker labible-horloge (Cloudflare > Workers > labible-horloge > Observability) et son secret GH_TOKEN."
              MANQUE=1
            else
              echo "OK  $W : $VU / $N"
            fi
          done
          exit $MANQUE
