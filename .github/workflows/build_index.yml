name: Build verses index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build index
        run: python build_index.py
      - name: Commit index
        run: |
          git config user.name "bible-telegram-bot"
          git config user.email "bible-telegram-bot@users.noreply.github.com"
          git add verses_index.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Add verses index"
          for i in 1 2 3; do
            if git push; then
              echo "Index enregistre."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "::error::Index NON enregistre apres 3 tentatives."
          exit 1
