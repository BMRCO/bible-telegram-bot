name: Soumettre les URLs a IndexNow

# Notifie Bing, Yandex, Naver, Seznam et Yep de toutes les URLs du sitemap,
# en un seul appel groupe. Google NE participe PAS a ce protocole (voir
# commentaire dans submit_indexnow.py) ; il continue de dependre du sitemap
# classique deja soumis separement dans Search Console.
#
# Declenchement manuel : Actions -> Soumettre les URLs a IndexNow -> Run workflow.
# A relancer apres tout ajout important de pages (nouvelles pages editoriales,
# etc). Resoumettre des URLs deja connues n'a pas d'effet negatif.

on:
  workflow_dispatch:

# Le workflow ne modifie pas le depot.
permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Soumettre a IndexNow
        run: python submit_indexnow.py
