name: Diagnostic jeton Facebook

# Verifie, sans jamais l'afficher, que FB_PAGE_TOKEN est bien le jeton
# de la Page dont l'id est FB_PAGE_ID. N'ecrit et ne publie rien.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifier le jeton
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse
          pid = os.environ.get("FB_PAGE_ID", "").strip()
          tok = os.environ.get("FB_PAGE_TOKEN", "").strip()
          print("::notice::FB_PAGE_ID est un nombre : " + ("OUI" if pid.isdigit() else "NON"))
          if not tok:
              sys.exit("FB_PAGE_TOKEN vide")
          url = "https://graph.facebook.com/v25.0/me?fields=id&" + urllib.parse.urlencode({"access_token": tok})
          try:
              me = json.load(urllib.request.urlopen(url, timeout=30))
          except Exception as e:
              print("::error::Le jeton est refuse par Facebook : " + type(e).__name__)
              sys.exit(1)
          page = me.get("id") == pid
          print("::notice::FB_PAGE_TOKEN est le jeton de la Page FB_PAGE_ID : " + ("OUI" if page else "NON (jeton d'utilisateur ou d'une autre Page)"))
          sys.exit(0 if page else 1)
          PY
