name: Pentecôte 2026

on:
  schedule:
    # Cron em UTC. France = UTC+2 (été)
    # 🕊️ Pentecôte = Dimanche 24 mai 2026
    # On limite aux crons matchent CE dimanche via condition de date dans le job
    # 🛡️ 5h03 UTC → 7h03 FR  | slot 1 — Le Consolateur (image)
    # 🌿 7h12 UTC → 9h12 FR  | slot 2 — La Promesse accomplie (reel)
    # 💡 10h00 UTC → 12h00 FR | slot 3 — Le Fruit de l'Esprit (image)
    # ✝️ 13h45 UTC → 15h45 FR | slot 4 — L'Esprit de vérité (reel)
    # 📯 17h41 UTC → 19h41 FR | slot 5 — La Prophétie accomplie (image)
    # 🎵 19h08 UTC → 21h08 FR | slot 6 — Ne me retire pas ton Esprit (reel)
    - cron: '3 5 24 5 *'
    - cron: '12 7 24 5 *'
    - cron: '0 10 24 5 *'
    - cron: '45 13 24 5 *'
    - cron: '41 17 24 5 *'
    - cron: '8 19 24 5 *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot Pentecôte à publier (1-6)'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  contents: write

concurrency:
  group: pentecote-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine Pentecôte slot
        id: slot
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_SLOT="${{ inputs.slot }}"

          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              "3 5 24 5 *")   echo "slot=1" >> $GITHUB_OUTPUT ;;
              "12 7 24 5 *")  echo "slot=2" >> $GITHUB_OUTPUT ;;
              "0 10 24 5 *")  echo "slot=3" >> $GITHUB_OUTPUT ;;
              "45 13 24 5 *") echo "slot=4" >> $GITHUB_OUTPUT ;;
              "41 17 24 5 *") echo "slot=5" >> $GITHUB_OUTPUT ;;
              "8 19 24 5 *")  echo "slot=6" >> $GITHUB_OUTPUT ;;
              *)              echo "slot=1" >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "slot=$MANUAL_SLOT" >> $GITHUB_OUTPUT
          fi

      - name: Run Pentecôte bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python pentecote.py ${{ steps.slot.outputs.slot }}

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress Pentecôte [skip ci]"
          git push || true
