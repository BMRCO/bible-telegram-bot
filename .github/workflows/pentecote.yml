name: Pentecôte

# ─────────────────────────────────────────────────────────────
# Déclenchement MANUEL uniquement.
#
# La Pentecôte est une fête mobile (Pâques + 49 jours) : une date
# fixe dans le cron publierait le mauvais jour dès l'année suivante.
#
#   2026 : dimanche 24 mai
#   2027 : dimanche 16 mai
#   2028 : dimanche  4 juin
#   2029 : dimanche 20 mai
#   2030 : dimanche  9 juin
#
# Le jour venu, lancer le workflow une fois par slot, à l'heure
# souhaitée (Actions → Pentecôte → Run workflow → choisir le slot).
# Prévoir ~1 h 30 à 3 h de retard côté GitHub Actions : lancer en
# avance si l'heure de diffusion compte.
#
#   slot 1 — 🛡️ Le Consolateur              (image)
#   slot 2 — 🌿 La Promesse accomplie        (reel)
#   slot 3 — 💡 Le Fruit de l'Esprit         (image)
#   slot 4 — ✝️ L'Esprit de vérité           (reel)
#   slot 5 — 📯 La Prophétie accomplie       (image)
#   slot 6 — 🎵 Ne me retire pas ton Esprit  (reel)
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot à publier — 1 Consolateur · 2 Promesse · 3 Fruit de l''Esprit · 4 Esprit de vérité · 5 Prophétie · 6 Ne me retire pas ton Esprit'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  contents: write

# Groupe unique par run : deux slots lancés coup sur coup ne s'annulent pas.
concurrency:
  group: pentecote-post-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy cloudinary google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Pentecôte bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python pentecote.py ${{ inputs.slot }}

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress Pentecôte [skip ci]"
          git push || true
