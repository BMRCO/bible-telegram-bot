name: Meditation Psaume YouTube

on:
  schedule:
    - cron: '11 4 * * *'   # 04h11 UTC - Meditation Psaume (manha cedo)
  workflow_dispatch:
    inputs:
      psaume:
        description: 'Numero du Psaume (vide = automatique)'
        required: false
        type: string
        default: ''
      verses:
        description: 'Versets (ex: 1-22, vide = tout le psaume)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Grupo proprio e unico por run - nunca cancela nem e cancelado por outra run.
concurrency:
  group: meditation-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  meditation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run meditation bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PSAUME="${{ inputs.psaume }}"
          VERSES="${{ inputs.verses }}"
          if [ -n "$PSAUME" ] && [ -n "$VERSES" ]; then
            python psaume_meditation.py "$PSAUME" "$VERSES"
          elif [ -n "$PSAUME" ]; then
            python psaume_meditation.py "$PSAUME"
          else
            python psaume_meditation.py
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add progress_meditation.json
          git diff --staged --quiet || git commit -m "Update meditation progress [skip ci]"
          git push || true