name: Meditation Psaume YouTube

on:
  # Reprise le 2 novembre 2026 : deuxieme cycle des 150 Psaumes, NARRES
  # (voix Henri). Pause du 29 octobre au 2 novembre (premier cycle termine).
  # Plus de « schedule » GitHub depuis le 9 novembre 2026 : il arrivait 4 a 8 h
  # en retard. Le Worker Cloudflare labible-horloge (horloge/worker.js) lance
  # ce workflow a l'heure exacte par workflow_dispatch. Horaires : voir PLAN.
  workflow_dispatch:
    inputs:
      psaume:
        description: 'Numero du Psaume (vide = automatique)'
        required: false
        type: string
        default: ''
      verses:
        description: 'Versets (ex: 1-22, vide = tout le psaume)'
        required: false
        type: string
        default: ''
      essai:
        description: 'Essai : genere la video sans rien publier (branche echantillons-voix)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Grupo proprio e unico por run - nunca cancela nem e cancelado por outra run.
concurrency:
  group: meditation-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  meditation:
    if: github.event_name != 'schedule'
    # Epingle le 9 octobre 2026. ubuntu-latest passe a Ubuntu 26 entre le
    # 19 octobre et le 19 novembre 2026, progressivement : la bascule peut
    # arriver SANS AUCUN COMMIT et casser ffmpeg, Pillow ou les polices.
    # Ne pas remettre ubuntu-latest sans avoir teste l'image 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy edge-tts==7.3.1 google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        # 11 novembre 2026 : apt-get est reste bloque 1 h 19 (miroir Ubuntu muet) et
        # le job a ete tue sans rien publier. Chaque essai est borne, 3 essais.
        timeout-minutes: 15
        run: |
          command -v ffmpeg >/dev/null && { ffmpeg -version | head -1; exit 0; }
          APT="sudo timeout 240 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          for essai in 1 2 3; do
            if $APT update -qq && $APT install -y -qq ffmpeg; then ffmpeg -version | head -1; exit 0; fi
            echo "::warning::Installation de ffmpeg : essai $essai echoue"
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::ffmpeg n'a pas pu etre installe (apt-get)"
          exit 1

      - name: Run meditation bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          # Conversation privee pour les alertes de panne. Vide = pas d'alerte
          # privee, mais la run sort quand meme en erreur (e-mail GitHub).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Par l'environnement : une entree libre ne doit jamais etre interpolee dans un script.
          IN_PSAUME: ${{ inputs.psaume }}
          # Par l'environnement : une entree libre ne doit jamais etre interpolee dans un script.
          IN_VERSES: ${{ inputs.verses }}
          ESSAI: ${{ inputs.essai && '1' || '' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PSAUME="${IN_PSAUME}"
          VERSES="${IN_VERSES}"
          if [ -n "$PSAUME" ] && [ -n "$VERSES" ]; then
            python psaume_meditation.py "$PSAUME" "$VERSES"
          elif [ -n "$PSAUME" ]; then
            python psaume_meditation.py "$PSAUME"
          else
            python psaume_meditation.py
          fi

      - name: Publish test video on the echantillons-voix branch
        if: ${{ inputs.essai }}
        run: |
          mkdir -p /tmp/ech && cp echantillons/* /tmp/ech/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan echantillons-voix
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ech/* .
          git add -A
          git commit -q -m "Essai meditation narree"
          git push -f origin echantillons-voix

      - name: Commit progress
        # Ajoute le 10 octobre 2026. SANS CE `if:`, GitHub saute ce pas des
        # que le pas precedent echoue. Depuis que finaliser() sort en code 1
        # sur une panne partielle, la progression n'etait plus commitee et le
        # contenu ressortait le lendemain sur les plateformes qui l'avaient
        # deja recu. Republier est pire que rater. !cancelled() = on commite
        # en succes ET en echec, mais pas si le job a ete tue (timeout) :
        # dans ce cas on ne sait pas ou le script s'est arrete.
        if: ${{ !cancelled() && !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_meditation.json
          if [ -f videos_psaumes_audio.json ]; then git add videos_psaumes_audio.json; fi
          if git diff --staged --quiet; then
            echo "Aucun changement de progression."
            exit 0
          fi
          git commit -m "Update meditation progress [skip ci]"
          # Un commit peut arriver pendant l'execution du workflow : sans rebase
          # prealable le push est rejete (« fetch first »). On reessaie 3 fois.
          for i in 1 2 3; do
            if git push; then
              echo "Progression enregistree."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          # Echec silencieux interdit : sans progression enregistree, le meme
          # Psaume serait republie demain. Sortie en erreur -> e-mail GitHub.
          echo "::error::Progression NON enregistree apres 3 tentatives."
          exit 1
