name: Meditation Psaume YouTube

on:
  schedule:
    - cron: '39 4 * * *'      # 04h39 UTC - Meditation Psaume (manha cedo)
  workflow_dispatch:
    inputs:
      psaume:
        description: 'Numero du Psaume (vide = automatique)'
        required: false
        type: string
        default: ''
      verses:
        description: 'Versets (ex: 1-22, vide = tout le psaume)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Grupo proprio e unico por run - nunca cancela nem e cancelado por outra run.
concurrency:
  group: meditation-post-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  meditation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Current UTC time
        run: date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run meditation bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Par l'environnement : une entree libre ne doit jamais etre interpolee dans un script.
          IN_PSAUME: ${{ inputs.psaume }}
          # Par l'environnement : une entree libre ne doit jamais etre interpolee dans un script.
          IN_VERSES: ${{ inputs.verses }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PSAUME="${IN_PSAUME}"
          VERSES="${IN_VERSES}"
          if [ -n "$PSAUME" ] && [ -n "$VERSES" ]; then
            python psaume_meditation.py "$PSAUME" "$VERSES"
          elif [ -n "$PSAUME" ]; then
            python psaume_meditation.py "$PSAUME"
          else
            python psaume_meditation.py
          fi

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_meditation.json
          if git diff --staged --quiet; then
            echo "Aucun changement de progression."
            exit 0
          fi
          git commit -m "Update meditation progress [skip ci]"
          # Un commit peut arriver pendant l'execution du workflow : sans rebase
          # prealable le push est rejete (« fetch first »). On reessaie 3 fois.
          for i in 1 2 3; do
            if git push; then
              echo "Progression enregistree."
              exit 0
            fi
            echo "Push refuse (tentative $i) — rebase puis nouvel essai."
            git pull --rebase origin main || true
            sleep 5
          done
          # Echec silencieux interdit : sans progression enregistree, le meme
          # Psaume serait republie demain. Sortie en erreur -> e-mail GitHub.
          echo "::error::Progression NON enregistree apres 3 tentatives."
          exit 1