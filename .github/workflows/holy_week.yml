name: Semaine Sainte
on:
  # Plus de « schedule » depuis le 21 nov. 2026 : les 8 crons (dates de 2026
  # ecrites a la main) arrivaient 4 a 8 h en retard et ne servaient plus en 2027.
  # Lance chaque jour de la Semaine Sainte par meditation.yml (05h30 UTC, Worker
  # labible-horloge). holy_week.py calcule Paques et ne publie rien hors de ces 8 jours.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    if: github.event_name != 'schedule'
    # Epingle le 9 octobre 2026. ubuntu-latest passe a Ubuntu 26 entre le
    # 19 octobre et le 19 novembre 2026, progressivement : la bascule peut
    # arriver SANS AUCUN COMMIT et casser ffmpeg, Pillow ou les polices.
    # Ne pas remettre ubuntu-latest sans avoir teste l'image 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        # 21 nov. 2026 : l'action FedericoCarboni/setup-ffmpeg@v3 echoue (« Failed to read
        # version from readme ») : meme installation que les autres workflows.
        timeout-minutes: 12
        run: |
          APT="sudo timeout 150 apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1"
          if command -v ffmpeg >/dev/null || { $APT update -qq && $APT install -y -qq ffmpeg; }; then
            ffmpeg -version | head -1; exit 0
          fi
          echo "::warning::apt-get indisponible : ffmpeg statique (imageio-ffmpeg) utilise a la place"
          python3 -m pip install -q imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Install dependencies
        run: |
          pip install requests pillow numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Publier Semaine Sainte
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          # Conversation privee pour les alertes de panne. Vide = pas d'alerte
          # privee, mais la run sort quand meme en erreur (e-mail GitHub).
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python holy_week.py
