name: Purge Cloudflare Cache

on:
  push:
    branches:
      - main

# Le workflow ne touche pas au depot : aucune permission necessaire.
permissions: {}

concurrency:
  group: purge-cache
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge Cloudflare Cache
        env:
          # Par l'environnement, jamais interpole dans la commande : le depot
          # est public et un jeton inscrit dans une ligne de commande peut
          # se retrouver dans les journaux.
          CF_ZONE:  ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "❌ CLOUDFLARE_ZONE_ID ou CLOUDFLARE_API_TOKEN manquant."
            exit 1
          fi

          code=$(curl -s -o /tmp/cf.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if [ "$code" = "200" ]; then
            echo "✅ Cache purge."
          else
            echo "❌ Purge refuse (HTTP $code)"
            head -c 400 /tmp/cf.json
            exit 1
          fi
